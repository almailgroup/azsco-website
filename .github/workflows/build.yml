# Regenerates the static site whenever its source changes.
#
# GitHub Pages serves this repository exactly as it is -- it runs no build. The
# HTML is generated by tools/build.py and committed, so without this workflow a
# product saved in the CMS would change a JSON file and nothing else: the page
# would never appear. This closes that gap.
#
# The loop guard is the paths filter below. This job only ever commits the
# generated HTML and sitemap.xml, and none of those paths are triggers, so its
# own commit cannot start another run.
name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/build.py'
      - 'assets/img/products/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # lets you force a rebuild from the Actions tab

permissions:
  contents: write

concurrency:
  # Two products saved in quick succession should not race each other.
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate the site
        run: python3 tools/build.py

      - name: Check the generated HTML before publishing it
        # A malformed product should fail here and leave the live site on its
        # last good version, rather than publish a broken page.
        run: python3 tools/verify.py

      - name: Commit the regenerated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':(glob)**/*.html' sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed — the generated pages already match the content."
            exit 0
          fi
          git commit -m "Rebuild site from content

          Generated by tools/build.py from ${GITHUB_SHA::7}."
          git push
