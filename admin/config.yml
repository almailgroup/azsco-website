# Content editor for AZSCO's product catalogue.
#
# This is a Git-based CMS: saving a product commits a JSON file to this
# repository under content/products/. The "Build site" workflow then runs
# tools/build.py and commits the regenerated pages, and GitHub Pages serves
# them. There is no database anywhere in that chain.
#
# A save therefore takes a minute or two to appear on the live site: commit,
# rebuild, publish. That is normal and is the cost of the pages being static.

backend:
  name: github
  repo: almailgroup/azsco-website
  branch: main
  # The OAuth bridge that signs editors in with their GitHub account. This is
  # the /auth route added to the existing Cloudflare Worker.
  base_url: https://azsco-website-chatbot.steep-band-c624.workers.dev
  auth_endpoint: auth

# Editors publish straight to main. Switch to "editorial_workflow" if you ever
# want product changes to go through a pull request before they go live.
publish_mode: simple

media_folder: assets/img/products
public_folder: /assets/img/products

locale: en

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: content/products
    create: true
    delete: true
    extension: json
    format: json
    # The filename is the slug, and the slug is the URL.
    slug: '{{fields.slug}}'
    identifier_field: name_en
    summary: '{{name_en}}'
    sortable_fields: [order, name_en, category]
    fields:
      - {name: slug, label: 'URL slug (lowercase, hyphens only)', widget: string,
         pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Lowercase letters, numbers and single hyphens only']}
      - {name: published, label: Published, widget: boolean, default: true}
      - {name: order, label: 'Sort order (lower shows first)', widget: number,
         default: 50, value_type: int, min: 1, max: 999}
      - name: category
        label: Category
        widget: select
        default: surveillance
        # CMS-CATEGORIES:BEGIN -- generated by tools/build.py; do not edit by
        # hand. Edit PRODUCT_CATEGORIES there and rebuild, so the list the CMS
        # offers can never drift from the list the site can actually render.
        options:
          - {label: 'Surveillance', value: surveillance}
          - {label: 'Alarms & Detection', value: alarms}
          - {label: 'Access Control', value: access}
          - {label: 'Communications', value: comms}
        # CMS-CATEGORIES:END
      - {name: featured, label: 'Feature this product', widget: boolean, default: false,
         required: false, hint: 'Featured products are listed before all others, whatever their sort order.'}
      - {name: badge_en, label: 'Card badge (English, optional)', widget: string, required: false,
         hint: 'A short label in the corner of the card, e.g. New. Two or three words at most.'}
      - {name: badge_ar, label: 'Card badge (Arabic, optional)', widget: string, required: false}
      - {name: brands, label: 'Brands (optional)', widget: list, required: false,
         hint: 'One per entry, e.g. Hikvision. Shown on the card and the product page.'}
      - {name: model, label: 'Model or part number (optional)', widget: string, required: false,
         hint: 'Shown above the description. Always displayed left-to-right, including on the Arabic page.'}

      - {name: image, label: 'Photo (optional)', widget: image, required: false,
         hint: 'Shown at roughly 600×450. Please resize before uploading — a photo straight from a camera will slow the page down.'}
      - {name: image_alt_en, label: 'Photo description (English)', widget: string, required: false,
         hint: 'For screen readers and search engines. Describe what the photo shows.'}
      - {name: image_alt_ar, label: 'Photo description (Arabic)', widget: string, required: false}

      - name: gallery
        label: 'More images (optional)'
        widget: list
        required: false
        label_singular: Image
        hint: 'Shown in a grid below the product. Resize before uploading.'
        fields:
          - {name: image, label: Image, widget: image}
          - {name: alt_en, label: 'Description (English)', widget: string, required: false}
          - {name: alt_ar, label: 'Description (Arabic)', widget: string, required: false}

      # PDFs go to their own folder rather than in with the product photos.
      - {name: datasheet, label: 'Datasheet PDF (optional)', widget: file, required: false,
         media_folder: /assets/docs, public_folder: /assets/docs,
         hint: 'Adds a download button next to Request a Quote.'}

      - {name: name_en, label: 'Name (English)', widget: string}
      - {name: name_ar, label: 'Name (Arabic)', widget: string}
      - {name: summary_en, label: 'Short summary (English)', widget: text,
         hint: 'One or two sentences. This is the card text and the search-result description.'}
      - {name: summary_ar, label: 'Short summary (Arabic)', widget: text}
      - {name: description_en, label: 'Full description (English)', widget: text}
      - {name: description_ar, label: 'Full description (Arabic)', widget: text}

      - name: features
        label: 'What it includes'
        widget: list
        required: false
        label_singular: Point
        summary: '{{en}}'
        fields:
          - {name: en, label: English, widget: string}
          - {name: ar, label: Arabic, widget: string}

      - name: specs
        label: 'Specifications (optional)'
        widget: list
        required: false
        label_singular: Specification
        summary: '{{label_en}}: {{value_en}}'
        fields:
          - {name: label_en, label: 'Label (English)', widget: string}
          - {name: label_ar, label: 'Label (Arabic)', widget: string}
          - {name: value_en, label: 'Value (English)', widget: string}
          - {name: value_ar, label: 'Value (Arabic)', widget: string}

      - name: applications
        label: 'Where it is used (optional)'
        widget: list
        required: false
        label_singular: Use
        summary: '{{en}}'
        hint: 'Shown as tags, e.g. Banks, Warehouses, Residential compounds.'
        fields:
          - {name: en, label: English, widget: string}
          - {name: ar, label: Arabic, widget: string}

      - name: faqs
        label: 'Common questions (optional)'
        widget: list
        required: false
        label_singular: Question
        summary: '{{q_en}}'
        hint: 'Appears as an expandable list on the product page, and helps the page rank for real questions people search.'
        fields:
          - {name: q_en, label: 'Question (English)', widget: string}
          - {name: q_ar, label: 'Question (Arabic)', widget: string}
          - {name: a_en, label: 'Answer (English)', widget: text}
          - {name: a_ar, label: 'Answer (Arabic)', widget: text}

      # Optional overrides for how the page appears in search results. Left
      # empty, the name and summary above are used, which is usually right.
      - {name: seo_title_en, label: 'Search title (English, optional)', widget: string, required: false,
         hint: 'Keep under about 60 characters or Google cuts it off. Leave empty to use the product name.'}
      - {name: seo_title_ar, label: 'Search title (Arabic, optional)', widget: string, required: false}
      - {name: seo_desc_en, label: 'Search description (English, optional)', widget: text, required: false,
         hint: 'Keep under about 155 characters. Leave empty to use the summary.'}
      - {name: seo_desc_ar, label: 'Search description (Arabic, optional)', widget: text, required: false}
